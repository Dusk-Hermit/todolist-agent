plugins {
    id 'com.android.application' version '8.3.2'
}

android {
    namespace 'dev.todolist.agent'
    compileSdk 34
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'dev.todolist.agent'
        minSdk 26
        targetSdk 34
        versionCode 402
        versionName '0.4.2'
    }

    sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('go-jni')
    packaging.jniLibs.useLegacyPackaging = true
}

def repo = rootProject.projectDir.parentFile
def buildGo = tasks.register('buildGo', Exec) {
    workingDir repo
    inputs.files(fileTree(repo) {
        include '*.go', '*.c', 'go.mod', 'go.sum', 'web/**', 'assets/icon.ico', 'android/build-native.ps1'
        exclude '*_test.go'
    })
    def output = layout.buildDirectory.dir('go-jni').get().asFile
    outputs.dir(output)
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass',
        '-File', new File(repo, 'android/build-native.ps1'), '-Ndk', android.ndkDirectory, '-Output', output
}
tasks.named('preBuild').configure { dependsOn buildGo }
